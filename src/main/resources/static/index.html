<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Allen's URL Shrink Ray</title>
<style>
  :root {
    --bg: #f6f7f9; --card: #ffffff; --ink: #1f2430; --muted: #6b7280;
    --accent: #2563eb; --accent-ink: #ffffff; --ok: #16a34a; --err: #dc2626;
    --border: #e5e7eb;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #12141a; --card: #1b1f2a; --ink: #e8eaf0; --muted: #9aa1af;
      --accent: #3b82f6; --ok: #4ade80; --err: #f87171; --border: #2a3040;
    }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; min-height: 100vh; display: flex; align-items: center; justify-content: center;
    background: var(--bg); color: var(--ink);
    font: 16px/1.6 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    padding: 24px;
  }
  .card {
    width: 100%; max-width: 560px; background: var(--card);
    border: 1px solid var(--border); border-radius: 16px; padding: 40px 36px;
    box-shadow: 0 8px 30px rgba(0,0,0,.06);
  }
  h1 { margin: 0 0 4px; font-size: 1.6rem; letter-spacing: -.02em; }
  .tagline { color: var(--muted); margin: 0 0 28px; font-size: .95rem; }
  form { display: flex; gap: 10px; }
  input[type=url] {
    flex: 1; padding: 12px 14px; font-size: 1rem; color: var(--ink);
    background: var(--bg); border: 1px solid var(--border); border-radius: 10px; outline: none;
  }
  input[type=url]:focus { border-color: var(--accent); }
  button {
    padding: 12px 20px; font-size: 1rem; font-weight: 600; cursor: pointer;
    background: var(--accent); color: var(--accent-ink); border: 0; border-radius: 10px;
  }
  button:disabled { opacity: .6; cursor: wait; }
  #out { margin-top: 24px; min-height: 1.5em; }
  .result {
    display: flex; align-items: center; gap: 10px; flex-wrap: wrap;
    padding: 14px 16px; border: 1px solid var(--border); border-radius: 10px; background: var(--bg);
  }
  .result a { color: var(--accent); font-weight: 600; word-break: break-all; text-decoration: none; }
  .copy { padding: 6px 12px; font-size: .85rem; font-weight: 500; background: transparent;
          color: var(--accent); border: 1px solid var(--accent); border-radius: 8px; }
  .note { color: var(--muted); font-size: .85rem; margin-top: 8px; }
  .ok { color: var(--ok); } .err { color: var(--err); }
  footer { margin-top: 32px; padding-top: 18px; border-top: 1px solid var(--border);
           color: var(--muted); font-size: .8rem; }
  footer a { color: var(--muted); }
</style>
</head>
<body>
<main class="card">
  <h1>Allen's URL Shrink Ray <span aria-hidden="true">🔫</span></h1>
  <p class="tagline">Long URLs walk in. Seven characters walk out. Nobody asks questions.</p>

  <form id="f">
    <input id="url" type="url" placeholder="https://paste.something.long/here?really=anything"
           required autocomplete="off" autofocus>
    <button id="go" type="submit">Shrink&nbsp;it</button>
  </form>

  <div id="out" aria-live="polite"></div>

  <footer>
    Handcrafted with engineering judgment by <strong>Lei&nbsp;(Allen)&nbsp;Zhao</strong> ·
    powered by Spring&nbsp;Boot, 62<sup>7</sup> possibilities, and exactly zero JavaScript frameworks ·
    <a href="/swagger-ui.html">API docs</a>
  </footer>
</main>

<script>
  const f = document.getElementById('f'), out = document.getElementById('out'),
        urlInput = document.getElementById('url'), go = document.getElementById('go');

  const spinnerLines = [
    'Negotiating with 62⁷ possibilities…',
    'Consulting ADR-002…',
    'Rolling dice, checking for collisions…'
  ];

  f.addEventListener('submit', async (e) => {
    e.preventDefault();
    const longUrl = urlInput.value.trim();
    go.disabled = true;
    out.innerHTML = `<span class="note">${spinnerLines[Math.floor(Math.random() * spinnerLines.length)]}</span>`;
    try {
      const res = await fetch('/api/urls', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ url: longUrl })
      });
      const body = await res.json().catch(() => ({}));
      if (res.status === 201) {
        const saved = longUrl.length - body.shortUrl.length;
        const quip = saved > 0
          ? `Saved you ${saved} characters. You're welcome. — Allen`
          : 'That URL was already shorter than mine. Bold move — shrunk it anyway.';
        out.innerHTML =
          `<div class="result"><a href="${body.shortUrl}" target="_blank" rel="noopener">${body.shortUrl}</a>` +
          `<button class="copy" id="copy">Copy</button>` +
          `<button class="copy" id="stats">Clicks?</button></div>` +
          `<p class="note ok">${quip}</p>`;
        document.getElementById('copy').onclick = async (ev) => {
          await navigator.clipboard.writeText(body.shortUrl);
          ev.target.textContent = 'Copied!';
          setTimeout(() => ev.target.textContent = 'Copy', 1500);
        };
        document.getElementById('stats').onclick = async (ev) => {
          const s = await (await fetch(`/api/urls/${body.code}/stats`)).json();
          ev.target.textContent = s.totalClicks === 0 ? '0 clicks (it’s early)' : `${s.totalClicks} clicks`;
        };
      } else if (res.status === 429) {
        out.innerHTML = `<p class="note err">Whoa there, speedy — rate limit reached. Even free APIs deserve a coffee break. Try again in a minute.</p>`;
      } else {
        const hint = /javascript|scheme/i.test(body.message || '')
          ? ' (Nice try. ADR-004 says no.)' : '';
        out.innerHTML = `<p class="note err">${body.message || 'Something went sideways.'}${hint}</p>`;
      }
    } catch {
      out.innerHTML = `<p class="note err">Could not reach the server. Is it running? (mvn spring-boot:run)</p>`;
    } finally {
      go.disabled = false;
    }
  });
</script>
</body>
</html>
